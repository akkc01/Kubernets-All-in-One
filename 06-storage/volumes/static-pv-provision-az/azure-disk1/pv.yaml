
apiVersion: v1
kind: PersistentVolume
metadata:
  name: static-pv
  # annotations:
  #   pv.kubernetes.io/provisioned-by: disk.csi.azure.com

spec:
  capacity:
    storage: 50Gi

  accessModes:
    - ReadWriteOnce

  persistentVolumeReclaimPolicy: Retain
  storageClassName: managed-csi

  csi:
    driver: disk.csi.azure.com
    volumeHandle: /subscriptions/4f7a617e-6fc6-408f-90d4-a001f57f156c/resourcegroups/pv-pvc-testing/providers/Microsoft.Compute/disks/pv-test

    volumeAttributes:
      fsType: ext4
