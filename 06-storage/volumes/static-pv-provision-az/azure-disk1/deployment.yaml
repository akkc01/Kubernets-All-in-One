
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-deployment
  namespace: storage-demo

spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx

  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
        - name: nginx
          image: nginx:alpine
          ports:
            - containerPort: 80
          
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi

          volumeMounts:
            - name: azure-storage
              mountPath: /usr/share/nginx/html

      volumes:
        - name: azure-storage
          persistentVolumeClaim:
            claimName: static-pvc
