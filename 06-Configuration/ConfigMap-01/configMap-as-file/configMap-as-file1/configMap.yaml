apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
  namespace: file1

data:
  Maneesh: "Hello Maneesh"
  Bhawani: "Hello Bhawani"
  APP_ENV: "Development"
  APP_NAME: "nginx-demo"
  APP_PORT: "80"
  LOG_LEVEL: "debug"
  
  akkc.conf: |
    server {
      listen 80;
      server_name localhost;

      location / {
        return 200 "Hello AKKC from ConfigMap!";
      }
    }