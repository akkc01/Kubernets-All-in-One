apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-volume
  namespace: file2

spec:
  replicas: 1

  selector:
    matchLabels:
      app: nginx-volume

  template:
    metadata:
      labels:
        app: nginx-volume

    spec:
      containers:
        - name: nginx
          image: nginx:alpine

          ports:
            - containerPort: 80

          resources:
            limits:
              memory: "128Mi"
              cpu: "500m"
            requests:
              memory: "64Mi"
              cpu: "250m"

          volumeMounts:
            - name: nginx-config-volume
              mountPath: /usr/share/nginx/html/index.html
              subPath: index.html
              readOnly: true

      volumes:
        - name: nginx-config-volume
          configMap:
            name: nginx-config