apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-envfrom
  namespace: configmap-as-env
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx-envfrom
  template:
    metadata:
      labels:
        app: nginx-envfrom
    spec:
      containers:
        - name: nginx
          image: nginx:alpine
          ports:
            - containerPort: 80

          resources:
            limits:
              memory: "128Mi"
              cpu: "500m"
            requests:
              memory: "64Mi"
              cpu: "250m"

          envFrom:
            - configMapRef:
                name: nginx-config