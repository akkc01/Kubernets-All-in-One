apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx

spec:
  replicas: 1

  selector:
    matchLabels:
      app: nginx

  template:
    metadata:
      labels:
        app: nginx

    spec:
      containers:
        - name: nginx
          image: nginx:alpine

          ports:
            - containerPort: 80

          env:
            - name: APP_USERNAME
              valueFrom:
                secretKeyRef:
                  name: nginx-secret
                  key: username

            - name: APP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: nginx-secret
                  key: password