apiVersion: apps/v1
kind: Deployment
metadata:
  name: myapp-deploy2
spec:
  replicas: 2
  selector:
    matchLabels:
      app: myapp
      app1: nginx
  template:
    metadata:
      labels:
        app: myapp
        app1: nginx
        app2: dev
        app3: test
        app4: prod

    spec:
      containers:
      - name: nginx-container
        image: nginx:latest
        ports:
        - containerPort: 80
        resources:
          requests:
            memory: "64Mi"
            cpu: "250m"
          limits:
            memory: "128Mi"
            cpu: "500m"
        volumeMounts:   
        - name: azure-storage
          mountPath: usr/share/nginx/html

      volumes:
      - name: azure-storage
        persistentVolumeClaim:
          claimName: azurefile-pvc-akkc
