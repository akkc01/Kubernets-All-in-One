apiVersion: apps/v1
kind: Deployment
metadata:
  name: email-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: email-app
  template:
    metadata:
      labels:
        app: email-app
    spec:
      containers:
      - name: email-app
        image: nginx:latest
        ports:
        - containerPort: 80
        volumeMounts:
        - name: email-app-html
          mountPath: /usr/share/nginx/html
      volumes:
      - name: email-app-html
        configMap:
          name: email-app-html