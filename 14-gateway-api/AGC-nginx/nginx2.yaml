apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-2
  namespace: agc-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx-2
  template:
    metadata:
      labels:
        app: nginx-2
    spec:
      containers:
        - name: nginx
          image: nginx:1.27
          ports:
            - containerPort: 80
          command:
            - /bin/sh
            - -c
            - |
              echo '<h1>Welcome to Prod nginx-server from AGC</h1><p>Traffic reached nginx-2</p>' > /usr/share/nginx/html/index.html
              nginx -g 'daemon off;'

