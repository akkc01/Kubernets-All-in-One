---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: stress-app-dev-deployment
  namespace: dev
spec:
  replicas: 1

  selector:
    matchLabels:
      app: stress-app

  template:
    metadata:
      labels:
        app: stress-app

    spec:
      containers:
      - name: stress-app
        image: polinux/stress

        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "256Mi"

        command:
        - stress
        - --cpu
        - "1"
        - --vm
        - "1"
        - --vm-bytes
        - "200M"
        - --vm-hang
        - "0"