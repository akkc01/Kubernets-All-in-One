apiVersion: v1
kind: Pod

metadata:
  name: kv-test-pod
  namespace: akkc

  labels:
    azure.workload.identity/use: "true"

spec:
  serviceAccountName: akkc-pod-sa

  containers:
    - name: app
      image: nginx

      volumeMounts:
        - name: secrets-store
          mountPath: "/mnt/secrets"
          readOnly: true

  volumes:
    - name: secrets-store
      csi:
        driver: secrets-store.csi.k8s.io
        readOnly: true
        volumeAttributes:
          secretProviderClass: azure-kv

