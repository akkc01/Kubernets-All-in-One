apiVersion: apps/v1
kind: Deployment

metadata:
  name: nginx-deployment

spec:
  replicas: 3

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1   # Max kitne pods down ho sakte hain
      maxSurge: 1         # Extra kitne pods temporarily bana sakte hain

  selector:
    matchLabels:
      app: nginx-app

  template:
    metadata:
      labels:
        app: nginx-app

    spec:
      containers:
        - name: nginx-container
          image: nginx:latest   # version change yahin hota hai

          ports:
            - containerPort: 80
            
          resources:
            requests:
              memory: "64Mi"
              cpu: "250m"
            limits:
              memory: "128Mi"
              cpu: "500m"

          imagePullPolicy: IfNotPresent