apiVersion: v1
kind: Pod
metadata:
  labels:
    app: sourav
    env: bhawani
  name: sourav
  namespace: bhawani-manish
spec:
  containers:
  - image: nginx:latest
    name: sourav
    ports:
    - containerPort: 80
    resources:
      requests:
        memory: "64Mi"
        cpu: "250m"
      limits:
        memory: "128Mi"
        cpu: "500m"

