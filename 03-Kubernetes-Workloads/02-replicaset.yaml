apiVersion: apps/v1
kind: ReplicaSet

metadata:
  name: nginx-replicaset
  labels:
    app: nginx-app

spec:
  replicas: 2   # Kitne pods chalana h

  selector:
    matchLabels:
      app: nginx-app

  template:
    metadata:
      labels:
        app: nginx-app
        env: dev

    spec:
      containers:
        - name: nginx-container
          image: nginx:latest

          ports:
            - containerPort: 80

          resources:
            requests:
              memory: "64Mi"
              cpu: "250m"
            limits:
              memory: "128Mi"
              cpu: "500m"

          imagePullPolicy: IfNotPresent