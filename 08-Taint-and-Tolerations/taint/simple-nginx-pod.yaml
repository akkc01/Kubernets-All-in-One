apiVersion: v1
kind: Pod
metadata:
  name: nginx-with-toleration

spec:

  containers:
    - name: nginx
      image: nginx:1.27
      ports:
      
        - containerPort: 80

      resources:
        requests:
          memory: "64Mi"
          cpu: "250m"
        limits:
          memory: "128Mi"
          cpu: "500m"