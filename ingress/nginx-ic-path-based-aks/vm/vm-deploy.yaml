apiVersion: apps/v1
kind: Deployment
metadata:
  name: vm-deployment
spec:
  replicas: 5
  selector:
    matchLabels:
      app: vm-app
  template:
    metadata:
      labels:
        app: vm-app
    spec:
      containers:
      - name: vm-app
        image: nginx:latest
        ports:
        - containerPort: 80

        resources:
          requests:
            cpu: "2000m"
            memory: "128Mi"
          limits:
            cpu: "3000m"
            memory: "256Mi"

        volumeMounts:
        - name: vm-app-html
          mountPath: /usr/share/nginx/html
      volumes:
      - name: vm-app-html
        configMap:
          name: vm-app-html