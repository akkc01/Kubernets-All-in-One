apiVersion: apps/v1
kind: Deployment
metadata:
  name: main-app1-deployment
  namespace: akkc-app1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: main-app1
  template:
    metadata:
      labels:
        app: main-app1
    spec:
      containers:
      - name: main-app1
        image: nginx:latest
        ports:
        - containerPort: 80
        volumeMounts:
        - name: main-page1
          mountPath: /usr/share/nginx/html
      volumes:
      - name: main-page1
        configMap:
          name: main-app1-html