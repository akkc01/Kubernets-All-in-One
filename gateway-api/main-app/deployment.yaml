apiVersion: apps/v1
kind: Deployment
metadata:
  name: main-app-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: main-app
  template:
    metadata:
      labels:
        app: main-app
    spec:
      containers:
      - name: main-app
        image: nginx:latest
        ports:
        - containerPort: 80
        volumeMounts:
        - name: main-page
          mountPath: /usr/share/nginx/html
      volumes:
      - name: main-page
        configMap:
          name: main-app-html