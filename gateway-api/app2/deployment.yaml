apiVersion: apps/v1
kind: Deployment
metadata:
  name: main-app2-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: main-app2
  template:
    metadata:
      labels:
        app: main-app2
    spec:
      containers:
      - name: main-app2
        image: nginx:latest
        ports:
        - containerPort: 80
        volumeMounts:
        - name: main-page2
          mountPath: /usr/share/nginx/html
      volumes:
      - name: main-page2
        configMap:
          name: main-app2-html