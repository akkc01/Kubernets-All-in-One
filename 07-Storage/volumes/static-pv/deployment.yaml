apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-deployment
  namespace: nginx
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
      - name: nginx
        image: nginx
        ports:
        - containerPort: 80
        resources:
            requests:
              memory: "64Mi"
              cpu: "250m"
            limits:
              memory: "128Mi"
              cpu: "500m"
              
        volumeMounts:
        - name: nginx-storage
          mountPath: /usr/share/nginx/html   # nginx default content path

      volumes:
      - name: nginx-storage
        persistentVolumeClaim:
          claimName: demo-pvc