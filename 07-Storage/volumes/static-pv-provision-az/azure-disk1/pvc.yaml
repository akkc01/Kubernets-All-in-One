apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: static-pvc01
  namespace: pv-test

spec:
  accessModes:
    - ReadWriteOnce

  storageClassName: managed-csi-manish # shold be same as PV storageClassName
  resources:
    requests:
      storage: 20Gi

  volumeName: static-pv01 # directly bind to PV, should be same as PV name
