apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: azurefile-pvc-akkc
  namespace: pv-fs-test
  
spec:
  volumeName: azurefile-pv-akkc   #  direct binding (best for static)

  accessModes:
    - ReadWriteMany
  storageClassName: "akkcfileshare"       # must match PV

  resources:
    requests:
      storage: 50Gi
