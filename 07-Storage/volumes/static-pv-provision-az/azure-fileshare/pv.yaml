apiVersion: v1
kind: PersistentVolume
metadata:
  name: azfs-pv-test
spec:
  capacity:
    storage: 60Gi
  accessModes:
    - ReadWriteMany
  storageClassName: "akkc01"              #  important (no dynamic provisioning)
  persistentVolumeReclaimPolicy: Retain

  azureFile:
    secretName: azfs-secret
    shareName: pvfileshare
    readOnly: false
