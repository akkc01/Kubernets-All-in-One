apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass

metadata:
  name: az-scp-kv-test
  namespace: kv-test

spec:
  provider: azure
  parameters:
    clientID: "e5b752c8-9b96-4e5d-a730-d9151f5e5767"
    keyvaultName: "aks-testing-kv001"
    tenantId: "06d607ee-4b45-4a9c-b43f-15f05be0e043"

    objects: |  # Fetch secrets from Azure Key Vault
      array:
        - |
          objectName: db-username
          objectType: secret
        - |
          objectName: db-password
          objectType: secret
        - |
          objectName: api-key
          objectType: secret

  secretObjects:  # Create Kubernetes Secret
    - secretName: kv-secret
      type: Opaque
      data:
        - objectName: db-username
          key: DB_USERNAME
        - objectName: db-password
          key: DB_PASSWORD
        - objectName: api-key
          key: API_KEY