apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: azure-kv-provider
  namespace: maneesh

spec:
  provider: azure
  secretObjects:
    - secretName: azure-kv-secrets
      type: Opaque
      data:
        - objectName: PGADMIN-DEFAULT-EMAIL
          key: PGADMIN-DEFAULT-EMAIL
        - objectName: PGADMIN-DEFAULT-PASSWORD
          key: PGADMIN-DEFAULT-PASSWORD

  parameters:
    usePodIdentity: "false"
    clientID: "edc04c88-374b-4fe3-9316-ebf505b443fb"
    keyvaultName: "aks-test-kv-devops"
    tenantId: "7be7583d-6096-48b0-9578-ff57b08babe5"

    objects: |
      array:
        - |
          objectName: PGADMIN-DEFAULT-EMAIL
          objectType: secret
        - |
          objectName: PGADMIN-DEFAULT-PASSWORD
          objectType: secret