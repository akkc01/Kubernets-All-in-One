apiVersion: apps/v1
kind: Deployment

metadata:
  name: nginx-blue
  labels:
    app: nginx-app
    version: blue

spec:
  replicas: 3

  selector:
    matchLabels:
      app: nginx-app
      version: blue

  template:
    metadata:
      labels:
        app: nginx-app
        version: blue

    spec:
      containers:
        - name: nginx
          image: nginx:1.25

          ports:
            - containerPort: 80

          resources:
            requests:
              memory: "64Mi"
              cpu: "250m"
            limits:
              memory: "128Mi"
              cpu: "500m"


---


apiVersion: apps/v1
kind: Deployment

metadata:
  name: nginx-green
  labels:
    app: nginx-app
    version: green

spec:
  replicas: 3

  selector:
    matchLabels:
      app: nginx-app
      version: green

  template:
    metadata:
      labels:
        app: nginx-app
        version: green

    spec:
      containers:
        - name: nginx
          image: nginx:1.26   #  new version

          ports:
            - containerPort: 80

          resources:
            requests:
              memory: "64Mi"
              cpu: "250m"
            limits:
              memory: "128Mi"
              cpu: "500m"



---

apiVersion: v1
kind: Service

metadata:
  name: nginx-service

spec:
  selector:
    app: nginx-app
    version: blue   #  initially blue

  ports:
    - port: 80
      targetPort: 80

  type: ClusterIP